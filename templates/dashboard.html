<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Agent - Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        
        .metric-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
        }
        
        .metric-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
        }
        
        .metric-change {
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .positive { color: #4caf50; }
        .negative { color: #f44336; }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        #portfolioChart {
            height: 400px !important;
        }
        
        .reasoning-list, .trades-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .reasoning-item, .trade-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        
        .reasoning-item:hover, .trade-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        
        .reasoning-header, .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .asset-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(102, 126, 234, 0.2);
        }
        
        .action-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .action-badge.buy { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .action-badge.sell { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .action-badge.hold { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        
        .timestamp {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .rationale {
            font-size: 0.9rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
        }
        
        .trade-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        .trade-detail {
            font-size: 0.85rem;
        }
        
        .trade-detail-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }
        
        .positions-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .position-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            border-left: 3px solid;
        }
        
        .position-card.long { border-left-color: #4caf50; }
        .position-card.short { border-left-color: #f44336; }
        
        .position-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .position-coin {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .position-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 0.85rem;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 AI Trading Agent</h1>
                <p class="timestamp" id="lastUpdate">Last update: --</p>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>LIVE</span>
            </div>
        </header>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Value</div>
                <div class="metric-value" id="totalValue">$0.00</div>
                <div class="metric-change" id="valueChange">+0.00%</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Total PnL</div>
                <div class="metric-value" id="totalPnl">$0.00</div>
                <div class="metric-change" id="pnlChange">+0.00%</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Available Balance</div>
                <div class="metric-value" id="balance">$0.00</div>
            </div>
            
            <div class="metric-card">
                <div class="metric-label">Open Positions</div>
                <div class="metric-value" id="positionsCount">0</div>
            </div>
        </div>
        
        <div class="main-grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">📈 Portfolio Value (24h)</h2>
                </div>
                <canvas id="portfolioChart"></canvas>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">🧠 AI Reasoning</h2>
                </div>
                <div class="reasoning-list" id="reasoningList">
                    <p style="text-align: center; opacity: 0.5;">No reasoning yet...</p>
                </div>
            </div>
        </div>
        
        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header">
                <h2 class="card-title">💼 Open Positions</h2>
            </div>
            <div class="positions-grid" id="positionsList">
                <p style="text-align: center; opacity: 0.5;">No positions</p>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📊 Trade History</h2>
            </div>
            <div class="trades-list" id="tradesList">
                <p style="text-align: center; opacity: 0.5;">No trades yet...</p>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let chart;
        
        // Initialize Chart
        const ctx = document.getElementById('portfolioChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Portfolio Value',
                    data: [],
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        backgroundColor: 'rgba(10, 14, 39, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        borderColor: 'rgba(102, 126, 234, 0.5)',
                        borderWidth: 1
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { color: 'rgba(255, 255, 255, 0.5)' }
                    },
                    y: {
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: { 
                            color: 'rgba(255, 255, 255, 0.5)',
                            callback: value => '$' + value.toFixed(2)
                        }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        });
        
        socket.on('connect', () => {
            console.log('Connected to server');
        });
        
        socket.on('portfolio_update', (data) => {
            updateDashboard(data);
        });
        
        function updateDashboard(data) {
            // Update metrics
            document.getElementById('totalValue').textContent = `$${data.total_value.toFixed(2)}`;
            document.getElementById('balance').textContent = `$${data.balance.toFixed(2)}`;
            document.getElementById('totalPnl').textContent = `$${data.total_pnl.toFixed(2)}`;
            document.getElementById('positionsCount').textContent = data.positions.length;
            
            const pnlEl = document.getElementById('totalPnl');
            pnlEl.className = `metric-value ${data.total_pnl >= 0 ? 'positive' : 'negative'}`;
            
            const pnlChangeEl = document.getElementById('pnlChange');
            const pnlPct = data.balance > 0 ? (data.total_pnl / data.balance * 100) : 0;
            pnlChangeEl.textContent = `${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%`;
            pnlChangeEl.className = `metric-change ${pnlPct >= 0 ? 'positive' : 'negative'}`;
            
            document.getElementById('lastUpdate').textContent = `Last update: ${new Date(data.last_update).toLocaleTimeString()}`;
            
            // Update chart
            if (data.portfolio_history && data.portfolio_history.length > 0) {
                chart.data.labels = data.portfolio_history.map(p => {
                    const date = new Date(p.timestamp);
                    return date.toLocaleTimeString();
                });
                chart.data.datasets[0].data = data.portfolio_history.map(p => p.value);
                chart.update('none');
            }
            
            // Update positions
            const positionsList = document.getElementById('positionsList');
            if (data.positions.length === 0) {
                positionsList.innerHTML = '<p style="text-align: center; opacity: 0.5;">No positions</p>';
            } else {
                positionsList.innerHTML = data.positions.map(p => `
                    <div class="position-card ${p.side.toLowerCase()}">
                        <div class="position-header">
                            <span class="position-coin">${p.coin}</span>
                            <span class="action-badge ${p.side.toLowerCase()}">${p.side}</span>
                        </div>
                        <div class="position-stats">
                            <div>
                                <div class="trade-detail-label">Size</div>
                                <div>${Math.abs(p.size).toFixed(4)}</div>
                            </div>
                            <div>
                                <div class="trade-detail-label">Entry</div>
                                <div>$${p.entry_price.toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="trade-detail-label">Current</div>
                                <div>$${p.current_price.toFixed(2)}</div>
                            </div>
                            <div>
                                <div class="trade-detail-label">PnL</div>
                                <div class="${p.pnl >= 0 ? 'positive' : 'negative'}">
                                    $${p.pnl.toFixed(2)} (${p.pnl_pct.toFixed(2)}%)
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            // Update AI reasoning
            const reasoningList = document.getElementById('reasoningList');
            if (!data.ai_reasoning || data.ai_reasoning.length === 0) {
                reasoningList.innerHTML = '<p style="text-align: center; opacity: 0.5;">No reasoning yet...</p>';
            } else {
                reasoningList.innerHTML = data.ai_reasoning.map(r => `
                    <div class="reasoning-item">
                        <div class="reasoning-header">
                            <span class="asset-badge">${r.asset}</span>
                            <span class="action-badge ${r.action}">${r.action}</span>
                        </div>
                        <div class="rationale">${r.rationale}</div>
                        <div class="timestamp">${new Date(r.timestamp).toLocaleString()}</div>
                    </div>
                `).join('');
            }
            
            // Update trades
            const tradesList = document.getElementById('tradesList');
            if (!data.trades || data.trades.length === 0) {
                tradesList.innerHTML = '<p style="text-align: center; opacity: 0.5;">No trades yet...</p>';
            } else {
                tradesList.innerHTML = data.trades.slice(0, 20).map(t => `
                    <div class="trade-item">
                        <div class="trade-header">
                            <span class="asset-badge">${t.coin}</span>
                            <span class="action-badge ${t.side.toLowerCase()}">${t.side}</span>
                        </div>
                        <div class="trade-details">
                            <div class="trade-detail">
                                <div class="trade-detail-label">Size</div>
                                <div>${t.size.toFixed(4)}</div>
                            </div>
                            <div class="trade-detail">
                                <div class="trade-detail-label">Price</div>
                                <div>$${t.price.toFixed(2)}</div>
                            </div>
                            <div class="trade-detail">
                                <div class="trade-detail-label">Total</div>
                                <div>$${t.total.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="timestamp">${new Date(t.timestamp).toLocaleString()}</div>
                    </div>
                `).join('');
            }
        }
        
        // Fetch initial data
        fetch('/api/portfolio')
            .then(res => res.json())
            .then(data => {
                if (data && Object.keys(data).length > 0) {
                    updateDashboard(data);
                }
            });
    </script>
</body>
</html>
